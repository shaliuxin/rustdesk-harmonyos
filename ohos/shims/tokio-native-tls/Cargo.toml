[package]
name = "tokio-native-tls"
version = "0.3.1"
edition = "2021"
description = "OpenHarmony shim: rustls-backed drop-in replacement for tokio-native-tls"
license = "MIT"
publish = false

# 为什么存在这个 crate：
#   hbb_common 无条件依赖 tokio-native-tls（proxy.rs / websocket.rs 的 wss 与代理 TLS）。
#   真实 tokio-native-tls -> native-tls -> openssl-sys，在 OpenHarmony 上无法交叉编译
#   （OpenSSL 官方 target 列表没有 ohos，vendored 构建需要 perl + 定制 Configure）。
#   本 crate 用项目里已有的 rustls 栈（ring provider）实现同一套 API 子集，
#   通过根 Cargo.toml 的 [patch.crates-io] 替换，从而不修改 hbb_common 子模块源码。
#   行为差异：证书校验走 webpki-roots，而非系统钥匙串。

[dependencies]
tokio = { version = "1", default-features = false, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pki-types = "1"
webpki-roots = "1"
